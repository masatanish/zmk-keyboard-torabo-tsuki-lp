CONFIG_ZMK_STUDIO=y
CONFIG_ZMK_STUDIO_LOCKING=n
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
# USB CDC ACM設定（studio-rpc-usb-uartスニペット用）
# 注意: CONFIG_ZMK_CDC_ACM_BOOTLOADER_TRIGGERはstudio-rpc-usb-uartスニペットが
# 適用された後に有効になる必要があるため、ここでは設定しない
# スニペットの設定が先に読み込まれるように、extra_kconfig_options.confに設定する
#CONFIG_ZMK_CDC_ACM_BOOTLOADER_TRIGGER=y
CONFIG_ZMK_STATUS_LED=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=9000000
CONFIG_ZMK_NON_LIPO_MIN_MV=1000
CONFIG_ZMK_NON_LIPO_LOW_MV=900
CONFIG_ZMK_USB_LOGGING=y
# USBロギング使用時、UARTコンソールが無い構成でもビルドできるようにする
CONFIG_LOG_BACKEND_UART=n
CONFIG_UART_CONSOLE=n
#CONFIG_ZMK_LOG_LEVEL=4